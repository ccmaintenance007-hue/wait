<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>We'll be right back! — crystal.cafe</title>
  <style>
    body {
      background: #200f2c url(/static/bg_dark.png);
      color: #a29e9e;
    }
    header div.subtitle, h1 {
      color: #ddbfe0;
      text-align: center;
    }
    div.pages {
      color: #b7b7b7;
      background: #4e2454;
      display: inline;
      padding: 8px;
      border-right: 1px solid #301335;
      border-bottom: 1px solid #301335;
      border-radius: 5px;
    }
    form table tr th {
      padding: 3px 5px 4px 4px!important;
      font-size: 97%!important;
      background: rgba(132, 0, 154, 0.64);
      border-radius: 7px;
    }
    a, a:visited {
      text-decoration: none;
      color: #d0aeff!important;
    }
    div.post.reply {
      background: #4e2454;
      border-color: #6e207b;
    }
    div.post.reply.highlighted {
      background: #2d1431;
      border-color: #6e207b;
    }
    div.banner, div.banner a {
      color: #ffdafa;
    }
    div.banner {
      background-color: #9e4094;
      text-align: center;
      font-size: 12pt;
      font-weight: bold;
      text-align: center;
      margin: 1em 0;
      padding-bottom: 2px;
    }
    p.intro span.subject {
      color: #d34bfd;
      font-weight: bold;
    }
    p.intro span.name {
      color: #906e89;
      font-weight: bold;
    }
    hr {
      border: none;
      border-top: 1px solid #8b649e;
      height: 0;
      clear: left;
    }
    div.blotter {
      color: #60306f;
      font-weight: bold;
      text-align: center;
    }
    .maintenance-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .maintenance-wrap .post.reply {
      max-width: 560px;
      width: 100%;
      padding: 2rem 2.5rem;
      border-width: 1px;
      border-style: solid;
      border-radius: 5px;
    }
    .maintenance-wrap .post.reply h1 {
      margin: 0 0 1rem;
      font-size: 1.5rem;
    }
    .cbox-wrap {
      text-align: center;
      margin: 1.5rem 0;
    }
    .cbox-wrap iframe {
      max-width: 100%;
    }
    .footer-img {
      text-align: center;
    }
    .footer-img img {
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="maintenance-wrap">
    <div class="post reply">
      <h1>We'll be right back!</h1>
      <div class="cbox-wrap">
        <iframe src="https://www5.cbox.ws/box/?boxid=968231&boxtag=abaUTg" width="100%" height="450" allowtransparency="yes" allow="autoplay" frameborder="0" marginheight="0" marginwidth="0" scrolling="auto"></iframe>
      </div>
      <div class="footer-img">
        <img src="/static/footer.gif" alt="" />
      </div>
    </div>
  </div>
</body>
</html>
