<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>We'll be right back! — crystal.cafe</title>
    <style>
      :root {
        --bg-dark: #200f2c;
        --panel-bg: #4e2454;
        --panel-border: #6e207b;
        --panel-dark: #2d1431;
        --accent: #ddbfe0;
        --muted: #a29e9e;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg-dark) url(/static/bg_dark.png) center center / cover no-repeat;
        color: var(--muted);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }

      .maintenance-wrap {
        width: min(100%, 720px);
      }

      .post.reply {
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 5px;
        padding: 2rem 2.5rem;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
      }

      .post.reply h1 {
        margin: 0 0 1rem;
        color: var(--accent);
        text-align: center;
        font-size: clamp(1.6rem, 2vw, 2rem);
        line-height: 1.2;
      }

      .cbox-wrap {
        text-align: center;
        margin: 1.5rem 0;
      }

      .cbox-wrap iframe {
        display: block;
        width: 100%;
        min-height: 450px;
        border: 0;
        background: transparent;
      }

      .footer-img {
        text-align: center;
        margin-top: 1rem;
      }

      .footer-img img {
        display: inline-block;
        max-width: 100%;
        height: auto;
      }

      @media (max-width: 640px) {
        .post.reply {
          padding: 1.25rem 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="maintenance-wrap">
      <div class="post reply">
        <h1>We'll be right back!</h1>

        <div class="cbox-wrap">
          <iframe
            src="https://www5.cbox.ws/box/?boxid=968231&boxtag=abaUTg"
            title="Community chat"
            allowtransparency="yes"
            allow="autoplay"
            frameborder="0"
            marginheight="0"
            marginwidth="0"
            scrolling="auto"
          ></iframe>
        </div>

        <div class="footer-img">
          <img src="http://crystal.cafe/static/footer.gif" alt="Crystal Cafe footer" />
        </div>
      </div>
    </div>
  </body>
</html>
